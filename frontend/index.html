<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Robotic Navigation Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    #controls { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      z-index: 10; 
      background: rgba(0,0,0,0.8); 
      color: white;
      padding: 15px; 
      border-radius: 8px; 
      min-width: 200px;
      max-width: 30%;
      font-size: 12px;
    }
    #controls button {
      margin: 5px 0;
      padding: 8px 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    #controls button:hover {
      background: #45a049;
    }
    #resetRobot {
      background: #ff6b6b !important;
    }
    #resetRobot:hover {
      background: #ff5252 !important;
    }
    #controls input[type="file"] {
      margin: 5px 0;
      padding: 5px;
      width: 100%;
    }
    #controls select {
      margin: 5px 0;
      padding: 5px;
      width: 100%;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
    }
    #info, #robotInfo, #helpInfo, #cameraInfo, #fpsInfo {
      margin-top: 10px;
      padding: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      font-size: 11px;
    }
    #robotInfo, #cameraInfo {
      font-family: monospace;
    }
    #fpsInfo {
      font-family: monospace;
      background: rgba(0,255,0,0.1);
      border-left: 3px solid #4CAF50;
    }
    #helpInfo {
      font-size: 10px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="controls">
    <input type="file" id="plyLoader" accept=".ply" />
    <button id="exportImage">Export Image</button>
    <button id="saveToServer">Save to Server</button>
    <button id="resetRobot">Reset Robot Position</button>
    <div>
      <label for="materialSelector">Render Mode:</label>
      <select id="materialSelector">
        <option value="gaussian">Point Cloud Gaussian Splats</option>
        <option value="object">Instanced Mesh 3D Objects</option>
        <option value="ellipseGradient">Instanced Ellipse Gradient</option>
        <option value="points">Point Cloud Simple Points</option>
      </select>
    </div>
    <div>
      <label for="harmonicDegree">SH Degree:</label>
      <select id="harmonicDegree">
        <option value="0">Degree 0 (DC only)</option>
        <option value="1">Degree 1</option>
        <option value="2" selected>Degree 2</option>
        <option value="3">Degree 3 (Full)</option>
      </select>
    </div>
    <div>
      <label for="shDirMode">SH Direction Mode:</label>
      <select id="shDirMode">
        <option value="0" selected>Identity (x, y, z)</option>
        <option value="1">Flip Y (x, -y, z)</option>
        <option value="2">Flip Z (x, y, -z)</option>
        <option value="3">Flip Y,Z (x, -y, -z)</option>
        <option value="4">Swap Y,Z (x, z, y)</option>
        <option value="5">Swap Y,Z + Flip Y (x, z, -y)</option>
        <option value="6">Swap Y,Z + Flip Z (x, -z, y)</option>
        <option value="7">All Negative (-x, -y, -z)</option>
        <option value="8">Cyclic XYZ→YZX (y, z, x)</option>
        <option value="9">Cyclic XYZ→ZXY (z, x, y)</option>
        <option value="10">Swap X,Y (y, x, z)</option>
        <option value="11">Swap X,Z (z, y, x)</option>
        <option value="12">Flip X (-x, y, z)</option>
        <option value="14">Flip X,Y (-x, -y, z)</option>
        <option value="15">Flip X,Z (-x, y, -z)</option>
        <option value="16">Swap X,Y + Flip X (y, -x, z)</option>
        <option value="17">Swap X,Y + Flip Y (-y, x, z)</option>
        <option value="18">Swap X,Z + Flip X (z, y, -x)</option>
        <option value="19">Swap X,Z + Flip Z (-z, y, x)</option>
        <option value="20">Cyclic + Flip X (y, z, -x)</option>
        <option value="21">Cyclic + Flip Y (-y, z, x)</option>
        <option value="22">Cyclic + Flip Z (y, -z, x)</option>
        <option value="23">Rev Cyclic + Flip X (z, -x, y)</option>
        <option value="24">No Conversion (viewDir)</option>
      </select>
    </div>
    <div>
      <label for="pointScale">Point Scale:</label>
      <input type="number" id="pointScale" min="1" max="100000" value="100" step="1" style="width: 80px;">
    </div>
    <div>
      <label for="chiScale">Chi Scale:</label>
      <input type="number" id="chiScale" min="0.1" max="100" value="1.0" step="0.1" style="width: 80px;">
    </div>
    <div>
      <label>Use arrow keys to navigate manually</label>
    </div>
    <div id="info">
      <span id="fileInfo">No file loaded</span>
    </div>
    <div id="robotInfo">
      <strong>Robot Position:</strong><br>
      X: <span id="robotX">0.00</span><br>
      Y: <span id="robotY">0.00</span><br>
      Z: <span id="robotZ">0.00</span><br>
      Rotation: <span id="robotRotation">0.00°</span>
    </div>
    <div id="cameraInfo">
      <strong>Camera Position:</strong><br>
      X: <span id="cameraX">0.00</span><br>
      Y: <span id="cameraY">1.00</span><br>
      Z: <span id="cameraZ">5.00</span><br>
      Look At: <span id="cameraTarget">Origin</span>
    </div>
    <div id="fpsInfo">
      <strong>Performance:</strong><br>
      FPS: <span id="fpsCounter">0</span><br>
      Frame Time: <span id="frameTime">0.00</span> ms
    </div>
    <div id="helpInfo">
      <strong>Controls:</strong><br>
      • Arrow Keys / WASD: Move<br>
      • Grid: Floor reference<br>
      • Axes: Red=X, Green=Y, Blue=Z<br>
      • Orange cone: Robot direction
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
  </script>

  <!--<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/loaders/PLYLoader.js"></script>-->
  <script type="module" src="main.js"></script>
</body>
</html>
